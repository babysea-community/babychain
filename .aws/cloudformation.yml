AWSTemplateFormatVersion: '2010-09-09'
Description: BabyChain on ECS Fargate behind an Application Load Balancer with optional scheduled run recovery.

Parameters:
  ProjectName:
    Type: String
    Default: babychain
    AllowedPattern: '^[a-z][a-z0-9-]{1,24}$'
    Description: Lowercase name prefix for AWS resources created by this stack.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the load balancer and ECS tasks. Tasks need outbound access to Aurora/PostgreSQL, BabySea, and inference providers.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more subnet IDs. Use public subnets with AssignPublicIp=ENABLED for first deploys, or private subnets with NAT.

  AssignPublicIp:
    Type: String
    Default: ENABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: Set DISABLED when ECS tasks run in private subnets with NAT access.

  LoadBalancerScheme:
    Type: String
    Default: internet-facing
    AllowedValues:
      - internet-facing
      - internal

  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach the Application Load Balancer on HTTP.

  ImageUri:
    Type: String
    Default: public.ecr.aws/docker/library/node:24-bookworm-slim
    Description: BabyChain container image URI. Keep the placeholder while DesiredCount is 0, then update after pushing your image.

  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: Start at 0 until the image is pushed and Secrets Manager values are populated; then update to 1 or more.

  TaskCpu:
    Type: String
    Default: '1024'
    AllowedValues:
      - '512'
      - '1024'
      - '2048'

  TaskMemory:
    Type: String
    Default: '2048'
    AllowedValues:
      - '1024'
      - '2048'
      - '3072'
      - '4096'

  ContainerPort:
    Type: Number
    Default: 3000
    MinValue: 1
    MaxValue: 65535

  HealthCheckPath:
    Type: String
    Default: /

  SiteUrl:
    Type: String
    Default: ''
    Description: Optional public URL or custom domain. When blank, the stack uses the ALB HTTP URL for NEXT_PUBLIC_SITE_URL.

  ProviderMode:
    Type: String
    Default: byok
    AllowedValues:
      - byok
      - babysea

  BflRegion:
    Type: String
    Default: global
    AllowedValues:
      - global
      - eu
      - us

  BflApiBaseUrl:
    Type: String
    Default: https://api.bfl.ai/v1

  BabySeaRegion:
    Type: String
    Default: us

  BabySeaApiBaseUrl:
    Type: String
    Default: https://api.us.babysea.ai

  NextPublicSentryDsn:
    Type: String
    Default: ''
    Description: Optional public Sentry DSN.

  NextPublicSentryEnvironment:
    Type: String
    Default: production

  EnableCron:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: Enable after DesiredCount is above 0 and BABYCHAIN_CRON_SECRET is populated.

  CronScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    Description: EventBridge schedule expression for queued-run recovery.

  CronBatchLimit:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 50

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 7
      - 14
      - 30
      - 60
      - 90
      - 180
      - 365

Conditions:
  HasSiteUrl: !Not [!Equals [!Ref SiteUrl, '']]
  CronEnabled: !Equals [!Ref EnableCron, ENABLED]

Resources:
  BabyChainRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${ProjectName}'
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the last 20 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }

  BabyChainCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  BabyChainLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/ecs/${ProjectName}'
      RetentionInDays: !Ref LogRetentionDays

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: BabyChain load balancer ingress.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: BabyChain ECS task traffic from the load balancer and outbound provider access.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: !Ref LoadBalancerScheme
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets: !Ref SubnetIds
      Type: application
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: 'false'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: 200-399
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      UnhealthyThresholdCount: 5
      VpcId: !Ref VpcId
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP

  OwnerEmailSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/OWNER_EMAIL'
      Description: Dashboard owner email allowed to sign in.

  OwnerPasswordSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/OWNER_PASSWORD'
      Description: Dashboard owner password.

  OwnerSessionSecretSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/OWNER_SESSION_SECRET'
      Description: Secret used to sign owner dashboard sessions.

  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/DATABASE_URL'
      Description: PostgreSQL/Aurora connection string for BabyChain durable state.

  BabyChainApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/BABYCHAIN_API_KEY'
      Description: Caller API keys for BabyChain.

  BabyChainCronSecretSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/BABYCHAIN_CRON_SECRET'
      Description: Shared secret used by the scheduled cron recovery task.

  BabyChainCallbackSecretSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/BABYCHAIN_CALLBACK_SECRET'
      Description: Secret used to sign outbound terminal run callbacks.

  DashscopeApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/DASHSCOPE_API_KEY'
      Description: Alibaba Cloud DashScope API key for BYOK mode.

  BflApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/BFL_API_KEY'
      Description: Black Forest Labs API key for BYOK mode.

  ArkApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/ARK_API_KEY'
      Description: BytePlus Ark API key for BYOK mode.

  GeminiApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/GEMINI_API_KEY'
      Description: Google Gemini API key for BYOK mode.

  OpenAiApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/OPENAI_API_KEY'
      Description: OpenAI API key for BYOK mode.

  RunwayApiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/RUNWAYML_API_SECRET'
      Description: Runway API key for BYOK mode.

  BabySeaApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/BABYSEA_API_KEY'
      Description: BabySea API key for BabySea provider mode.

  BabySeaWebhookSecretSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/BABYSEA_WEBHOOK_SECRET'
      Description: Optional BabySea webhook signature secret.

  SentryOrgSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/SENTRY_ORG'
      Description: Optional Sentry organization slug for source map uploads.

  SentryProjectSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/SENTRY_PROJECT'
      Description: Optional Sentry project slug for source map uploads.

  SentryAuthTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '/${ProjectName}/${AWS::StackName}/SENTRY_AUTH_TOKEN'
      Description: Optional Sentry auth token for source map uploads.

  BabyChainExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadBabyChainSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref OwnerEmailSecret
                  - !Ref OwnerPasswordSecret
                  - !Ref OwnerSessionSecretSecret
                  - !Ref DatabaseUrlSecret
                  - !Ref BabyChainApiKeySecret
                  - !Ref BabyChainCronSecretSecret
                  - !Ref BabyChainCallbackSecretSecret
                  - !Ref DashscopeApiKeySecret
                  - !Ref BflApiKeySecret
                  - !Ref ArkApiKeySecret
                  - !Ref GeminiApiKeySecret
                  - !Ref OpenAiApiKeySecret
                  - !Ref RunwayApiSecret
                  - !Ref BabySeaApiKeySecret
                  - !Ref BabySeaWebhookSecretSecret
                  - !Ref SentryOrgSecret
                  - !Ref SentryProjectSecret
                  - !Ref SentryAuthTokenSecret

  BabyChainTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  BabyChainTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-web'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt BabyChainExecutionRole.Arn
      TaskRoleArn: !GetAtt BabyChainTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: babychain
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: HOSTNAME
              Value: 0.0.0.0
            - Name: PORT
              Value: !Sub '${ContainerPort}'
            - Name: NEXT_PUBLIC_SITE_URL
              Value: !If
                - HasSiteUrl
                - !Ref SiteUrl
                - !Sub 'http://${LoadBalancer.DNSName}'
            - Name: BABYCHAIN_PROVIDER_MODE
              Value: !Ref ProviderMode
            - Name: BFL_REGION
              Value: !Ref BflRegion
            - Name: BFL_API_BASE_URL
              Value: !Ref BflApiBaseUrl
            - Name: BABYSEA_REGION
              Value: !Ref BabySeaRegion
            - Name: BABYSEA_API_BASE_URL
              Value: !Ref BabySeaApiBaseUrl
            - Name: NEXT_PUBLIC_SENTRY_DSN
              Value: !Ref NextPublicSentryDsn
            - Name: NEXT_PUBLIC_SENTRY_ENVIRONMENT
              Value: !Ref NextPublicSentryEnvironment
          Secrets:
            - Name: OWNER_EMAIL
              ValueFrom: !Ref OwnerEmailSecret
            - Name: OWNER_PASSWORD
              ValueFrom: !Ref OwnerPasswordSecret
            - Name: OWNER_SESSION_SECRET
              ValueFrom: !Ref OwnerSessionSecretSecret
            - Name: DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecret
            - Name: BABYCHAIN_API_KEY
              ValueFrom: !Ref BabyChainApiKeySecret
            - Name: BABYCHAIN_CRON_SECRET
              ValueFrom: !Ref BabyChainCronSecretSecret
            - Name: BABYCHAIN_CALLBACK_SECRET
              ValueFrom: !Ref BabyChainCallbackSecretSecret
            - Name: DASHSCOPE_API_KEY
              ValueFrom: !Ref DashscopeApiKeySecret
            - Name: BFL_API_KEY
              ValueFrom: !Ref BflApiKeySecret
            - Name: ARK_API_KEY
              ValueFrom: !Ref ArkApiKeySecret
            - Name: GEMINI_API_KEY
              ValueFrom: !Ref GeminiApiKeySecret
            - Name: OPENAI_API_KEY
              ValueFrom: !Ref OpenAiApiKeySecret
            - Name: RUNWAYML_API_SECRET
              ValueFrom: !Ref RunwayApiSecret
            - Name: BABYSEA_API_KEY
              ValueFrom: !Ref BabySeaApiKeySecret
            - Name: BABYSEA_WEBHOOK_SECRET
              ValueFrom: !Ref BabySeaWebhookSecretSecret
            - Name: SENTRY_ORG
              ValueFrom: !Ref SentryOrgSecret
            - Name: SENTRY_PROJECT
              ValueFrom: !Ref SentryProjectSecret
            - Name: SENTRY_AUTH_TOKEN
              ValueFrom: !Ref SentryAuthTokenSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BabyChainLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  BabyChainService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
    Properties:
      ServiceName: !Sub '${ProjectName}-web'
      Cluster: !Ref BabyChainCluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: babychain
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup
      TaskDefinition: !Ref BabyChainTaskDefinition

  BabyChainCronTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-cron'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt BabyChainExecutionRole.Arn
      TaskRoleArn: !GetAtt BabyChainTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: babychain-cron
          Image: public.ecr.aws/docker/library/node:24-bookworm-slim
          Essential: true
          Command:
            - node
            - -e
            - |
              const url = process.env.BABYCHAIN_CRON_URL;
              const secret = process.env.BABYCHAIN_CRON_SECRET;
              fetch(url, { headers: { authorization: 'Bearer ' + secret } })
                .then(async (response) => {
                  const body = await response.text();
                  console.log(body);
                  if (!response.ok) process.exit(1);
                })
                .catch((error) => {
                  console.error(error);
                  process.exit(1);
                });
          Environment:
            - Name: BABYCHAIN_CRON_URL
              Value: !Sub
                - '${BaseUrl}/api/cron/process-runs?limit=${CronBatchLimit}'
                - BaseUrl: !If
                    - HasSiteUrl
                    - !Ref SiteUrl
                    - !Sub 'http://${LoadBalancer.DNSName}'
          Secrets:
            - Name: BABYCHAIN_CRON_SECRET
              ValueFrom: !Ref BabyChainCronSecretSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BabyChainLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: cron

  BabyChainCronInvokeRole:
    Type: AWS::IAM::Role
    Condition: CronEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunBabyChainCronTask
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: !Ref BabyChainCronTaskDefinition
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt BabyChainExecutionRole.Arn
                  - !GetAtt BabyChainTaskRole.Arn

  BabyChainCronRule:
    Type: AWS::Events::Rule
    Condition: CronEnabled
    Properties:
      Description: Scheduled BabyChain queued-run recovery.
      ScheduleExpression: !Ref CronScheduleExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt BabyChainCluster.Arn
          Id: BabyChainCronTask
          RoleArn: !GetAtt BabyChainCronInvokeRole.Arn
          EcsParameters:
            LaunchType: FARGATE
            TaskDefinitionArn: !Ref BabyChainCronTaskDefinition
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: !Ref AssignPublicIp
                SecurityGroups:
                  - !Ref ServiceSecurityGroup
                Subnets: !Ref SubnetIds

Outputs:
  SiteUrl:
    Description: Runtime URL used by BabyChain.
    Value: !If
      - HasSiteUrl
      - !Ref SiteUrl
      - !Sub 'http://${LoadBalancer.DNSName}'

  LoadBalancerDnsName:
    Description: Application Load Balancer DNS name.
    Value: !GetAtt LoadBalancer.DNSName

  EcrRepositoryUri:
    Description: Push BabyChain images to this ECR repository and update ImageUri.
    Value: !GetAtt BabyChainRepository.RepositoryUri

  ClusterName:
    Value: !Ref BabyChainCluster

  ServiceName:
    Value: !GetAtt BabyChainService.Name

  LogGroupName:
    Value: !Ref BabyChainLogGroup

  SecretPrefix:
    Description: Populate retained Secrets Manager values under this prefix before raising DesiredCount.
    Value: !Sub '/${ProjectName}/${AWS::StackName}/'

  CronRuleName:
    Condition: CronEnabled
    Value: !Ref BabyChainCronRule
