apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: babychain
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '10'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/babychain/babychain:latest
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          env:
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NEXT_TELEMETRY_DISABLED
              value: '1'
            - name: NEXT_PUBLIC_SITE_URL
              value: https://babychain-REGION-PROJECT_HASH.a.run.app
            - name: OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: babychain-owner-email
                  key: latest
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: babychain-owner-password
                  key: latest
            - name: OWNER_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: babychain-owner-session-secret
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: babychain-database-url
                  key: latest
            - name: BABYCHAIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: babychain-api-key
                  key: latest
            - name: BABYCHAIN_CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: babychain-cron-secret
                  key: latest
            - name: BABYCHAIN_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: babychain-callback-secret
                  key: latest
            - name: BABYCHAIN_PROVIDER_MODE
              value: byok
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: babychain-dashscope-api-key
                  key: latest
            - name: BFL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: babychain-bfl-api-key
                  key: latest
            - name: BFL_REGION
              value: global
            - name: BFL_API_BASE_URL
              value: https://api.bfl.ai/v1
            - name: ARK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: babychain-ark-api-key
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: babychain-gemini-api-key
                  key: latest
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: babychain-openai-api-key
                  key: latest
            - name: RUNWAYML_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: babychain-runway-api-secret
                  key: latest
            - name: BABYSEA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: babychain-babysea-api-key
                  key: latest
            - name: BABYSEA_REGION
              value: us
            - name: BABYSEA_API_BASE_URL
              value: https://api.us.babysea.ai
            - name: BABYSEA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: babychain-babysea-webhook-secret
                  key: latest
            - name: NEXT_PUBLIC_SENTRY_DSN
              value: ''
            - name: NEXT_PUBLIC_SENTRY_ENVIRONMENT
              value: production
