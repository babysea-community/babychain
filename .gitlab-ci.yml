include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Code-Quality.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: DAST.gitlab-ci.yml

stages:
  - verify
  - test
  - build
  - security
  - dast

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  GIT_DEPTH: '0'
  AST_ENABLE_MR_PIPELINES: 'true'
  GITLAB_ADVANCED_SAST_ENABLED: 'true'
  SECURE_LOG_LEVEL: warn
  SAST_EXCLUDED_PATHS: '.next,.pnpm-store,coverage,dist,build,node_modules,public'
  DS_EXCLUDED_PATHS: '.next,.pnpm-store,coverage,dist,build,node_modules,public'
  SECRET_DETECTION_EXCLUDED_PATHS: '.next,.pnpm-store,coverage,dist,build,node_modules,public'
  SECRET_DETECTION_HISTORIC_SCAN: 'true'
  CONTAINER_SCANNING_DISABLED: 'false'
  CS_DISABLE_DEPENDENCY_LIST: 'false'
  DAST_BROWSER_SCAN: 'true'
  PNPM_VERSION: '11.7.0'
  PNPM_INSTALL_FLAGS: --frozen-lockfile --ignore-scripts
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
  DAST_WEBSITE: https://babychain.babysea.live
  NEXT_PUBLIC_SITE_URL: https://your-app.example.com
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  OWNER_EMAIL: ci_owner_email
  OWNER_PASSWORD: ci_owner_password
  OWNER_SESSION_SECRET: ci_owner_session_secret
  BABYCHAIN_API_KEY: ci_babychain_api_key
  BABYCHAIN_CRON_SECRET: ci_babychain_cron_secret
  BABYCHAIN_CALLBACK_SECRET: ci_babychain_callback_secret
  BABYCHAIN_PROVIDER_MODE: byok
  DASHSCOPE_API_KEY: ci_dashscope_api_key
  BFL_API_KEY: ci_bfl_api_key
  BFL_REGION: global
  BFL_API_BASE_URL: https://example.bfl.ai
  ARK_API_KEY: ci_ark_api_key
  GEMINI_API_KEY: ci_gemini_api_key
  OPENAI_API_KEY: ci_openai_api_key
  RUNWAYML_API_SECRET: ci_runway_api_secret
  BABYSEA_API_KEY: ci_babysea_api_key
  BABYSEA_REGION: us
  BABYSEA_API_BASE_URL: https://api.us.babysea.ai
  BABYSEA_WEBHOOK_SECRET: ci_babysea_webhook_secret
  NEXT_PUBLIC_SENTRY_DSN: https://example.sentry.io
  NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
  SENTRY_ORG: ci
  SENTRY_PROJECT: ci
  SENTRY_AUTH_TOKEN: ci_sentry_auth_token

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

container_scanning:
  stage: security
  allow_failure: true
  rules:
    - if: '$CONTAINER_SCANNING_DISABLED == "true" || $CONTAINER_SCANNING_DISABLED == "1"'
      when: never
    - if: '$CS_IMAGE'
    - when: never

code_quality:
  allow_failure: true

gemnasium-dependency_scanning:
  allow_failure: true

gitlab-advanced-sast:
  allow_failure: true

kics-iac-sast:
  allow_failure: true

secret_detection:
  allow_failure: true

.pnpm-job:
  image: node:24-bookworm
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: pnpm-${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install $PNPM_INSTALL_FLAGS

verify:doctor:
  stage: verify
  extends: .pnpm-job
  timeout: 10m
  script:
    - |
      if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts?.doctor ? 0 : 1)"; then
        pnpm doctor
      else
        echo 'No doctor script; skipping.'
      fi

verify:format:
  stage: verify
  extends: .pnpm-job
  timeout: 10m
  script:
    - |
      if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts?.format ? 0 : 1)"; then
        pnpm format
      else
        echo 'No format script; skipping.'
      fi

verify:lint:
  stage: verify
  extends: .pnpm-job
  timeout: 10m
  script:
    - |
      if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts?.lint ? 0 : 1)"; then
        pnpm lint
      else
        echo 'No lint script; skipping.'
      fi

verify:typecheck:
  stage: verify
  extends: .pnpm-job
  timeout: 10m
  script:
    - |
      if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts?.typecheck ? 0 : 1)"; then
        pnpm typecheck
      else
        echo 'No typecheck script; skipping.'
      fi

test:coverage:
  stage: test
  extends: .pnpm-job
  timeout: 15m
  coverage: '/All files[^|]*\|[^|]*\s+([0-9.]+)/'
  script:
    - mkdir -p coverage
    - |
      if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts?.['test:coverage'] ? 0 : 1)"; then
        pnpm test:coverage
      elif node -e "const pkg=require('./package.json'); process.exit(pkg.scripts?.test ? 0 : 1)"; then
        pnpm test
      else
        echo 'No test or test:coverage script; skipping.'
      fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/

coverage:upload:
  stage: security
  image: alpine:3.22
  allow_failure: true
  needs:
    - job: test:coverage
      artifacts: true
  timeout: 5m
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache ca-certificates curl
  script:
    - if [ ! -f coverage/lcov.info ]; then echo 'coverage/lcov.info was not produced; skipping GitLab Codecov upload.'; exit 0; fi
    - if [ -z "${CODECOV_TOKEN:-}" ]; then echo 'CODECOV_TOKEN is not configured; skipping GitLab Codecov upload.'; exit 0; fi
    - if [ -z "${CODECOV_UPLOADER_SHA256:-}" ]; then echo 'CODECOV_UPLOADER_SHA256 is not configured; skipping GitLab Codecov upload.'; exit 0; fi
    - curl --fail --location --retry 3 --retry-delay 2 --output codecov "${CODECOV_UPLOADER_URL:-https://uploader.codecov.io/latest/linux/codecov}"
    - printf '%s  codecov\n' "$CODECOV_UPLOADER_SHA256" | sha256sum -c -
    - chmod +x codecov
    - ./codecov -Z -t "$CODECOV_TOKEN" -f coverage/lcov.info -F gitlab -n "$CI_JOB_NAME" -C "$CI_COMMIT_SHA"

build:app:
  stage: build
  extends: .pnpm-job
  timeout: 15m
  script:
    - |
      if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts?.build ? 0 : 1)"; then
        pnpm build
      else
        echo 'No build script; skipping.'
      fi

dependency:audit:
  stage: security
  extends: .pnpm-job
  allow_failure: true
  timeout: 10m
  needs: []
  script:
    - pnpm audit --prod --audit-level=high

secret:scan:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.28.0
    entrypoint: ['']
  allow_failure: true
  timeout: 5m
  needs: []
  script:
    - gitleaks detect --source . --no-banner --redact

dast:
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never
