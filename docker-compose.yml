services:
  babychain:
    image: ${BABYCHAIN_IMAGE:-babysea/babychain:latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    ports:
      - '${BABYCHAIN_HOST_PORT:-3000}:3000'
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      OWNER_SESSION_SECRET: ${OWNER_SESSION_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      BABYCHAIN_API_KEY: ${BABYCHAIN_API_KEY}
      BABYCHAIN_CRON_SECRET: ${BABYCHAIN_CRON_SECRET}
      BABYCHAIN_CALLBACK_SECRET: ${BABYCHAIN_CALLBACK_SECRET}
      BABYCHAIN_PROVIDER_MODE: ${BABYCHAIN_PROVIDER_MODE:-byok}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BFL_API_KEY: ${BFL_API_KEY:-}
      BFL_REGION: ${BFL_REGION:-global}
      BFL_API_BASE_URL: ${BFL_API_BASE_URL:-https://api.bfl.ai/v1}
      ARK_API_KEY: ${ARK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUNWAYML_API_SECRET: ${RUNWAYML_API_SECRET:-}
      BABYSEA_API_KEY: ${BABYSEA_API_KEY:-}
      BABYSEA_REGION: ${BABYSEA_REGION:-us}
      BABYSEA_API_BASE_URL: ${BABYSEA_API_BASE_URL:-https://api.us.babysea.ai}
      BABYSEA_WEBHOOK_SECRET: ${BABYSEA_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:''+(process.env.PORT||3000)+''/api/v1/models'').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
